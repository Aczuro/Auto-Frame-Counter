name: Build Geode Mod (PC - Windows)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows (Win64)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC x64 Developer Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Geode CLI, SDK v5.11.2 & Pre-built Binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          # 1. Đảm bảo Ninja có sẵn
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
              choco install ninja -y --no-progress
          }

          # 2. Tải Geode CLI bản Windows qua GitHub CLI
          $cliDir = "$env:RUNNER_TEMP\geode-cli"
          New-Item -ItemType Directory -Force -Path $cliDir | Out-Null
          gh release download --repo geode-sdk/cli --pattern "*win*.zip" --dir $cliDir --clobber
          $cliZip = Get-ChildItem -Path $cliDir -Filter "*.zip" | Select-Object -First 1
          7z x $cliZip.FullName "-o$cliDir" -y | Out-Null
          echo "$cliDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$cliDir;$env:PATH"

          # 3. Clone đúng tag v5.11.2 của Geode SDK khớp với mod.json ("geode": "5.11.2")
          $sdkDir = "$env:GITHUB_WORKSPACE\geode-sdk"
          git clone --depth 1 --branch v5.11.2 https://github.com/geode-sdk/geode.git $sdkDir
          echo "GEODE_SDK=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:GEODE_SDK = $sdkDir

          # 4. Tải gói Pre-built Loader Binaries (Geode.lib / Geode.dll) của v5.11.2
          # Đặt trực tiếp vào cả `$sdkDir\bin\5.11.2` và `$sdkDir\bin\nightly` để CMake tìm thấy ngay lập tức
          # (Không gọi `geode.exe sdk install-binaries` vì CLI yêu cầu phải có game Geometry Dash cài sẵn trên máy ảo)
          $dlDir = "$env:RUNNER_TEMP\geode-bin-dl"
          New-Item -ItemType Directory -Force -Path $dlDir | Out-Null
          gh release download v5.11.2 --repo geode-sdk/geode --pattern "*win.zip" --dir $dlDir --clobber
          $sdkWinZip = Get-ChildItem -Path $dlDir -Filter "*.zip" | Select-Object -First 1

          $extractDir = "$dlDir\extracted"
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          7z x $sdkWinZip.FullName "-o$extractDir" -y | Out-Null

          $binVersionDir = "$sdkDir\bin\5.11.2"
          $binNightlyDir = "$sdkDir\bin\nightly"
          New-Item -ItemType Directory -Force -Path $binVersionDir | Out-Null
          New-Item -ItemType Directory -Force -Path $binNightlyDir | Out-Null

          # Copy toàn bộ Geode.lib / Geode.dll từ gói zip vào thư mục bin/5.11.2 và bin/nightly
          Get-ChildItem -Path $extractDir -Recurse -File | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "$binVersionDir\$($_.Name)" -Force
              Copy-Item -Path $_.FullName -Destination "$binNightlyDir\$($_.Name)" -Force
          }

          Write-Host "Installed Geode binaries in ${binVersionDir}:"
          Get-ChildItem -Path $binVersionDir | Format-Table Name, Length

          # 5. Cấu hình thư mục cache cho CPM
          $cpmCache = "$env:RUNNER_TEMP\cpm-cache"
          New-Item -ItemType Directory -Force -Path $cpmCache | Out-Null
          echo "CPM_SOURCE_CACHE=$cpmCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure and Build Mod (Ninja + MSVC x64)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Upload built .geode package
        uses: actions/upload-artifact@v4
        with:
          name: AutoFrameCounter-Windows
          path: |
            build/*.geode
            build/Release/*.geode
          if-no-files-found: error
