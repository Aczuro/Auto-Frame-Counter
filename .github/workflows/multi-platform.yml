name: Build Geode Mod (PC - Windows)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows (Win64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Tự cài đặt Geode CLI + Geode SDK v5.11.2 trực tiếp trên Windows
      # Hoàn toàn KHÔNG dùng geode-sdk/build-geode-mod@main để tránh lỗi ninja.zip 92 bytes và lỗi ép lên SDK 6.0.0-alpha.1
      - name: Setup Geode CLI & Geode SDK v5.11.2
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          # 1. Cài đặt Ninja qua Chocolatey (có sẵn trên Windows runner)
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
              choco install ninja -y --no-progress
          }

          # 2. Tải Geode CLI bản Windows mới nhất thông qua GitHub CLI (có xác thực GH_TOKEN, không bao giờ lỗi 92 bytes)
          $cliDir = "$env:RUNNER_TEMP\geode-cli"
          New-Item -ItemType Directory -Force -Path $cliDir | Out-Null
          gh release download --repo geode-sdk/cli --pattern "*win*.zip" --dir $cliDir --clobber
          $cliZip = Get-ChildItem -Path $cliDir -Filter "*.zip" | Select-Object -First 1
          7z x $cliZip.FullName "-o$cliDir" -y | Out-Null
          echo "$cliDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$cliDir;$env:PATH"

          # 3. Clone đúng nhánh tag v5.11.2 của Geode SDK khớp 100% với mod.json ("geode": "5.11.2")
          $sdkDir = "$env:GITHUB_WORKSPACE\geode-sdk"
          git clone --depth 1 --branch v5.11.2 https://github.com/geode-sdk/geode.git $sdkDir
          echo "GEODE_SDK=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # 4. Tạo sẵn thư mục CPM cache để CMake tải các thư viện phụ trợ ổn định
          $cpmCache = "$env:RUNNER_TEMP\cpm-cache"
          New-Item -ItemType Directory -Force -Path $cpmCache | Out-Null
          echo "CPM_SOURCE_CACHE=$cpmCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure and Build Mod (Windows x64)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Upload built .geode package
        uses: actions/upload-artifact@v4
        with:
          name: AutoFrameCounter-Windows
          path: |
            build/*.geode
            build/Release/*.geode
          if-no-files-found: error
